<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign in</title>
<style>
:root{--bg:#F6F5F1;--sheet:#fff;--ink:#14161B;--rule:#DAD8D0;--accent:#0B4FB3;--loss:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#0E1117;--sheet:#161B24;--ink:#EEF0F5;--rule:#2A3140;--accent:#7FB0FF;--loss:#FF8A80}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;min-height:100vh}
form{display:flex;gap:10px;flex-wrap:wrap;padding:16px;max-width:420px}
input,button{font:inherit;padding:10px 12px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);color:inherit}
button{background:var(--accent);color:#fff;border:0;font-weight:600;cursor:pointer}
#msg{width:100%;color:var(--loss);min-height:1.4em;margin:0}
</style>
</head>
<body>
<form id="f"><input id="k" type="password" placeholder="Key" autocomplete="current-password" aria-label="Key" style="flex:1;min-width:200px"><button>Open</button><p id="msg" role="status"></p></form>
<script>
(function(){
  var f=document.getElementById('f'),k=document.getElementById('k'),m=document.getElementById('msg');
  function open(key,quiet){
    return fetch('/api/stats?page=1',{headers:{'X-Stats-Key':key}}).then(function(r){
      if(!r.ok){try{sessionStorage.removeItem('pc.key')}catch(e){}if(!quiet)m.textContent='Not recognised.';return}
      return r.text().then(function(h){try{sessionStorage.setItem('pc.key',key)}catch(e){}document.open();document.write(h);document.close()});
    }).catch(function(){if(!quiet)m.textContent='Could not reach the server.'});
  }
  f.addEventListener('submit',function(e){e.preventDefault();m.textContent='';var v=k.value.trim();if(v)open(v,false)});
  try{var s=sessionStorage.getItem('pc.key');if(s)open(s,true)}catch(e){}
})();
</script>
</body>
</html>
