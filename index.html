@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/fonts/archivo-latin-wdth-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Archivo';font-style:italic;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(/fonts/archivo-latin-wdth-italic.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: a full-bleed ultramarine scoreboard band (company, quarter track, score) over one 680px reading column.
   One family, Archivo; width does the expressive work: expanded for headlines, condensed for scoreboard numbers.
   Boxes only where data lives (tables). Everything else is type, space and rules. */
:root{
  --paper:#EDEFF4; --sheet:#FFFFFF; --ink:#12162B; --muted:#555C72; --faint:#5F667C; --rule:#D3D7E2;
  --chair:#2B3BD1; --on-chair:#FFFFFF; --chair-dim:rgba(255,255,255,.86); --chair-line:rgba(255,255,255,.22);
  --accent:#2B3BD1; --accent-soft:#DCE0FA;
  --gain:#0B7A5C; --loss:#C23A22; --loss-soft:#F7E1DC; --ghost:#8A5E00; --ghost-soft:#F3E8CF;
  --r1:#D9DDF6; --r2:#D5ECE4; --r3:#F1E2CC; --r4:#EBDDEA; --r5:#DCE9F1;
  --f:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1120; --sheet:#171B30; --ink:#E7E9F3; --muted:#A0A7C2; --faint:#8A92B0; --rule:#2B3150;
  --chair:#2433B8; --accent:#93A0FF; --accent-soft:#232B5E;
  --gain:#52C99F; --loss:#F2806A; --loss-soft:#3A1F1A; --ghost:#E2B04E; --ghost-soft:#33291A;
  --r1:#2A3160; --r2:#1D3A33; --r3:#3D3020; --r4:#3A2840; --r5:#1F3444; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1120; --sheet:#171B30; --ink:#E7E9F3; --muted:#A0A7C2; --faint:#8A92B0; --rule:#2B3150;
  --chair:#2433B8; --accent:#93A0FF; --accent-soft:#232B5E;
  --gain:#52C99F; --loss:#F2806A; --loss-soft:#3A1F1A; --ghost:#E2B04E; --ghost-soft:#33291A;
  --r1:#2A3160; --r2:#1D3A33; --r3:#3D3020; --r4:#3A2840; --r5:#1F3444; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chair)}
a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.up{color:var(--gain)} .down{color:var(--loss)}
.num{font-variant-numeric:tabular-nums}
.label{font-size:14px;font-weight:650;color:var(--muted);font-stretch:100%}

/* ===== scoreboard band ===== */
.band{background:var(--chair);color:var(--on-chair)}
.band a{color:var(--on-chair)}
.band .wrap{padding-block:14px 22px;display:grid;gap:18px}
.band .row1{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;color:var(--on-chair);font-weight:700;font-stretch:112%;font-size:15px;letter-spacing:.01em}
.brand svg{width:18px;height:18px}
.grow{flex:1}
.bandbtn{background:none;border:1px solid var(--chair-line);color:var(--on-chair);border-radius:4px;padding:5px 11px;font-size:13.5px;cursor:pointer}
.bandbtn:hover{border-color:var(--chair-dim)}
.co-line{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.co-name{font-size:clamp(34px,7vw,56px);font-weight:820;font-stretch:122%;line-height:.95;letter-spacing:-.015em}
.co-sub{font-size:14px;color:var(--chair-dim);margin-top:8px}
.score{text-align:right}
.score .n{font-size:clamp(44px,9vw,72px);font-weight:760;font-stretch:68%;line-height:.9;letter-spacing:-.01em}
.score .k{font-size:13px;color:var(--chair-dim)}
.track{display:flex;gap:4px;align-items:center}
.track i{display:block;height:10px;flex:1;max-width:28px;border-radius:2px;background:var(--chair-line)}
.track i.done{background:var(--on-chair)}
.track i.done.neg{background:#FFB4A6}
.track i.now{background:transparent;outline:2px solid var(--on-chair);outline-offset:-2px}
.track-wrap{display:grid;gap:6px}
.track-wrap .k{font-size:13px;color:var(--chair-dim)}
.figs{display:flex;flex-wrap:wrap;gap:8px 28px;border-top:1px solid var(--chair-line);padding-top:12px;align-items:baseline}
.fig .k{font-size:12.5px;color:var(--chair-dim)}
.fig .v{font-size:21px;font-weight:700;font-stretch:80%;line-height:1.1}
.fig .v.warn{color:#FFC3B6}
.figs .bandbtn{margin-left:auto}
.dash{display:grid;gap:20px;border-top:1px solid var(--chair-line);padding-top:16px}
.dash h3{font-size:14px;font-weight:650;color:var(--chair-dim)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 24px;margin:0}
.dgrid dt{font-size:12.5px;color:var(--chair-dim)}
.dgrid dd{margin:1px 0 0;font-size:17px;font-weight:650;font-stretch:85%}
.dgrid .sub{font-size:12px;color:var(--chair-dim);line-height:1.35;margin-top:2px}
.bar{height:4px;background:var(--chair-line);border-radius:2px;overflow:hidden;margin-top:6px}
.bar b{display:block;height:100%;background:var(--on-chair)}
.bar b.low{background:#FFB4A6}
.meter .ml{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.meter .ml span{color:var(--chair-dim)}
.people-row{display:flex;gap:10px;align-items:center}
.home-hero{display:grid;gap:14px;padding-block:18px 8px}
.home-hero h1{font-size:clamp(48px,11vw,96px);font-weight:840;font-stretch:125%;line-height:.88;letter-spacing:-.025em}
.home-hero p{font-size:18px;max-width:58ch;color:var(--chair-dim)}
.home-hero p b{color:var(--on-chair);font-weight:600}

/* ===== reading column ===== */
main{padding-block:36px 72px}
.stack{display:grid;gap:22px}
.stack>*{min-width:0}
.tight{gap:10px}
.card{display:grid;gap:12px;min-width:0}
.card>*{min-width:0}
.section{display:grid;gap:12px;padding-top:22px;border-top:1px solid var(--rule)}
.section.event,.section.board,.section.chart{border-top:0}
.h1{font-size:clamp(30px,5.4vw,44px);font-weight:780;font-stretch:115%;line-height:1.02;letter-spacing:-.015em}
.h2{font-size:clamp(25px,4.4vw,34px);font-weight:760;font-stretch:112%;line-height:1.06;letter-spacing:-.01em}
.h3{font-size:17px;font-weight:700;font-stretch:108%}
.lede{font-size:18px;line-height:1.55;max-width:62ch}
.body{font-size:16.5px;max-width:64ch}
.note{font-size:14px;color:var(--muted);max-width:68ch}
.kicker{font-size:14px;color:var(--muted)}
.kicker b{color:var(--ink);font-weight:650}

/* buttons */
.btn{appearance:none;border:0;background:var(--chair);color:var(--on-chair);font-weight:650;font-size:15.5px;padding:13px 22px;border-radius:4px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.12)}
.btn[disabled]{opacity:.3;cursor:not-allowed;filter:none}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.btn.sec:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.btn.link{background:none;color:var(--accent);padding-inline:4px;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* pickers (home) */
.step{display:flex;align-items:baseline;gap:12px}
.step .n{font-size:15px;font-weight:700;font-stretch:70%;color:var(--accent)}
.grid-co{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0;border-top:1px solid var(--rule)}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--rule)}
@media (max-width:640px){.grid-3{grid-template-columns:1fr}}
.choice{appearance:none;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:16px 14px 16px 0;cursor:pointer;display:grid;gap:3px;align-content:start;min-width:0;position:relative}
.choice:hover .n{color:var(--accent)}
.choice[aria-checked="true"]{background:var(--chair);color:var(--on-chair);padding-left:14px;border-bottom-color:var(--chair)}
.choice[aria-checked="true"] .t,.choice[aria-checked="true"] .d{color:var(--chair-dim)}
.choice[aria-checked="true"] .n{color:var(--on-chair)}
.choice .t{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.choice .n{font-weight:780;font-stretch:118%;font-size:22px;line-height:1.1}
.choice .s{font-size:14.5px;font-weight:550}
.choice .d{font-size:13.5px;color:var(--muted)}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.facts li{font-size:15.5px;padding-left:18px;position:relative;max-width:66ch}
.facts li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:2px;background:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.field{display:grid;gap:6px;max-width:360px}
.field label{font-size:14px;color:var(--muted)}
.field input{font-family:var(--f);font-size:16px;padding:11px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);color:var(--ink)}
details.fold{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:14px}
details.fold+details.fold{border-top:0}
details.fold>summary{cursor:pointer;font-weight:700;font-stretch:108%;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"Show";font-weight:500;font-size:14px;color:var(--accent);font-stretch:100%}
details.fold[open]>summary::after{content:"Hide"}
details.fold[open]>summary{margin-bottom:14px}
.list{margin:0;padding-left:20px;display:grid;gap:8px;max-width:68ch}

/* briefing */
.event{background:var(--sheet);border-radius:4px;padding:18px;display:grid;gap:8px}
.event .flag{font-size:13.5px;font-weight:650;color:var(--loss)}
.event.good .flag{color:var(--gain)}
.agenda{list-style:none;margin:0;padding:0;counter-reset:a}
.agenda li{counter-increment:a;display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--rule);align-items:baseline}
.agenda li::before{content:counter(a);font-weight:700;font-stretch:70%;color:var(--accent)}
.agenda .c{font-size:13px;color:var(--muted)}
.due{display:grid;gap:16px}
.dueitem{display:grid;gap:6px}
.quote{display:flex;gap:10px;align-items:flex-start;font-size:15px}

/* people */
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;font-stretch:90%;color:var(--ink);background:var(--r1)}
.av.sm{width:28px;height:28px;font-size:11px}
.av.r2{background:var(--r2)}.av.r3{background:var(--r3)}.av.r4{background:var(--r4)}.av.r5{background:var(--r5)}.av.ext{background:transparent;box-shadow:inset 0 0 0 1px var(--rule);color:var(--muted)}
.band .av{color:var(--chair);background:var(--on-chair)}
.advisors{display:grid;gap:18px}
.adv{display:flex;gap:14px;align-items:flex-start}
.adv q{quotes:"\201C" "\201D";font-size:17px;font-style:italic;line-height:1.45;display:block}
.adv .who{font-size:13.5px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.adv .who b{color:var(--ink);font-weight:650}
.trust{display:inline-flex;align-items:center;gap:6px}
.trust .tbar{display:inline-block;width:46px;height:4px;background:var(--rule);border-radius:2px;overflow:hidden}
.trust .tbar b{display:block;height:100%;background:var(--ghost)}
.trust .tbar b.low{background:var(--loss)}
.tag{font-size:12.5px;font-weight:650;color:var(--ghost)}
.tag.g{color:var(--gain)} .tag.r{color:var(--loss)}

/* decision */
.prog{display:flex;gap:4px}
.prog span{height:4px;flex:1;max-width:60px;border-radius:2px;background:var(--rule)}
.prog span.on{background:var(--accent)}
.opts{display:grid;border-top:1px solid var(--rule)}
.opt{appearance:none;text-align:left;width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:18px 14px 18px 0;cursor:pointer;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;color:var(--ink)}
.opt:hover .ol{color:var(--accent)}
.opt .lt{font-size:24px;font-weight:800;font-stretch:70%;line-height:1;color:var(--faint)}
.opt .ol{font-weight:700;font-stretch:106%;font-size:17.5px;line-height:1.25}
.opt .od{font-size:15px;color:var(--muted);margin-top:3px}
.opt[aria-checked="true"]{background:var(--chair);color:var(--on-chair);padding-left:14px;border-bottom-color:var(--chair)}
.opt[aria-checked="true"] .lt,.opt[aria-checked="true"] .od{color:var(--chair-dim)}
.opt[aria-checked="true"] .ol{color:var(--on-chair)}
.opt[aria-checked="true"] .chip,.opt[aria-checked="true"] .ctx,.opt[aria-checked="true"] .odds{color:var(--on-chair)}
.opt[aria-checked="true"] .chip::before{background:var(--on-chair)}
.chips{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px}
.chip{font-size:13.5px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip::before{content:"";width:7px;height:7px;border-radius:1px;background:var(--faint)}
.chip.up{color:var(--gain)} .chip.up::before,.chip.down::before{display:none}
.chip.down{color:var(--loss)} 
.chip.risk{color:var(--ghost)} .chip.risk::before{background:var(--ghost);border-radius:50%}
.chip.jobs{color:var(--ink);font-weight:700} .chip.jobs::before{background:var(--ink)}
.ctx{display:grid;gap:3px;margin-top:10px;font-size:14px;font-style:italic;color:var(--muted)}
.ctx .good{color:var(--gain)} .ctx .bad{color:var(--loss)}
.opt[aria-checked="true"] .ctx div{color:var(--on-chair)}
.odds{display:grid;gap:6px;margin-top:10px;font-size:14px}
.oddrow{display:grid;grid-template-columns:44px 1fr;gap:8px}
.oddrow .pct{font-weight:750;font-stretch:75%;font-size:16px}
.gloss dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 28px}
.gloss dt{font-weight:700;font-size:15px}
.gloss dd{margin:2px 0 0;font-size:14.5px;color:var(--muted)}
.sites{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 24px}
.sites li{display:grid;gap:2px;font-size:15px}

/* allocation */
.group{display:grid;gap:10px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px}
.seg button{appearance:none;text-align:left;background:var(--sheet);border:0;border-radius:4px;padding:11px 12px;cursor:pointer;display:grid;gap:2px;min-width:0;box-shadow:inset 0 0 0 1px var(--rule)}
.seg button:hover{box-shadow:inset 0 0 0 1px var(--muted)}
.seg button[aria-checked="true"]{background:var(--chair);color:var(--on-chair);box-shadow:none}
.seg button[aria-checked="true"] small{color:var(--chair-dim)}
.seg b{font-size:15px;font-weight:700}
.seg small{font-size:12.5px;color:var(--muted);line-height:1.35}
.advice{display:flex;gap:12px;align-items:flex-start;font-size:15px;max-width:66ch}
hr.sep{border:0;border-top:1px solid var(--rule);margin:0}

/* tables: the only boxed things */
.tblwrap{overflow-x:auto;background:var(--sheet);border-radius:4px;padding:2px 16px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{padding:10px 0;border-bottom:1px solid var(--rule);text-align:right;vertical-align:top}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-right:12px}
.tbl td+td,.tbl th+th{padding-left:14px}
.tbl thead th{font-size:13px;color:var(--muted);font-weight:600}
.tbl td.n{white-space:nowrap;font-weight:550}
.tbl td.t{text-align:left;color:var(--muted);font-size:14px}
.tbl tr.sec td{padding-top:20px;font-size:14px;color:var(--accent);font-weight:700;text-align:left;font-stretch:108%}
.tbl tr.tot td{font-weight:750;border-bottom-color:var(--ink)}
.tbl tr:last-child td{border-bottom:0}

/* results */
.verdict{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.stamp{font-size:15px;font-weight:800;font-stretch:120%;padding:6px 12px;border-radius:4px;color:var(--on-chair);background:var(--muted)}
.stamp.up{background:var(--gain);color:#fff} .stamp.down{background:var(--loss);color:#fff}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px 24px}
.mgrid div{display:grid;gap:1px}
.mgrid span{font-size:13.5px;color:var(--muted)}
.mgrid b{font-size:20px;font-weight:720;font-stretch:80%}
.mgrid small{font-size:13px;font-weight:600}
.board{border-radius:4px;padding:16px 18px;background:var(--sheet)}
.board.warn{background:var(--loss-soft)}
.news{display:grid;gap:12px}
.news>div{display:grid;grid-template-columns:72px 1fr;gap:12px;font-size:15.5px;align-items:baseline}

/* call */
.qa{display:grid;gap:12px;padding-block:20px;border-top:1px solid var(--rule)}
.ask{display:flex;gap:14px;align-items:flex-start}

.why .wt{font-style:normal;color:var(--ink);margin:0 0 4px;font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.why p{font-style:normal;margin:0;font-size:16.5px;line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
.why .links{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;align-items:center}
.bright{border-left:4px solid var(--accent);background:var(--accent-soft);padding:16px 18px;border-radius:0 6px 6px 0;display:grid;gap:8px}
.bright .kicker{margin:0}
.bright p{margin:0;font-size:18px;line-height:1.4;font-weight:600}
.bright p.note{font-size:14.5px;font-weight:400;color:var(--muted)}
/* fake front page shown when the board fires you */
.paper{--ink2:#1A1814;--np:#EDE6D3;background:radial-gradient(ellipse at 20% 0,rgba(255,255,255,.55),transparent 60%),repeating-linear-gradient(0deg,rgba(60,45,20,.035) 0 1px,transparent 1px 3px),var(--np);color:var(--ink2);border:1px solid #BDB296;border-radius:2px;padding:14px 14px 16px;display:grid;gap:10px;font-family:Georgia,'Times New Roman',Times,serif;box-shadow:0 14px 34px -20px rgba(0,0,0,.6);min-width:0}
.paper *{min-width:0}
.pp-banner{font-family:Impact,'Haettenschweiler','Arial Narrow Bold',var(--f);font-weight:900;font-stretch:75%;text-transform:uppercase;text-align:center;color:#C8102E;font-size:clamp(76px,29vw,210px);line-height:.82;letter-spacing:.01em;padding:6px 0 4px;border-top:6px solid var(--ink2);border-bottom:2px solid var(--ink2);text-shadow:2px 2px 0 rgba(26,24,20,.18)}
.pp-head{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;text-align:center;border-bottom:3px double var(--ink2);padding-bottom:8px}
.pp-mast{font-weight:900;font-size:clamp(30px,10vw,60px);line-height:1;letter-spacing:-.01em;font-variant:small-caps;text-align:center;overflow-wrap:anywhere}
.pp-ear{display:none}
.pp-rule{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font:700 11px/1.3 var(--f);letter-spacing:.05em;text-transform:uppercase;color:#3B372E;border-bottom:1px solid var(--ink2);padding-bottom:6px}
.pp-fic{color:#8A1F14}
.pp-h{margin:2px 0 0;font-weight:900;font-size:clamp(34px,9.6vw,64px);line-height:1;letter-spacing:-.02em;overflow-wrap:break-word;text-wrap:balance}
.pp-deck{margin:0;font-style:italic;font-size:clamp(17px,4.4vw,22px);line-height:1.35;color:#38352C;border-bottom:1px solid var(--ink2);padding-bottom:10px}
.pp-grid{display:grid;gap:14px}
.pp-main{display:grid;gap:10px;align-content:start}
.pp-fig{margin:0;display:grid;gap:5px}
.pp-photo{aspect-ratio:4/3;background:#CFC8B4 var(--pp) center 20%/cover no-repeat;filter:grayscale(1) contrast(1.15) brightness(.98);position:relative;border:1px solid var(--ink2)}
.pp-photo::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.30) 0 28%,transparent 31%) 0 0/4px 4px;mix-blend-mode:multiply;opacity:.32}
.pp-fig figcaption{font:italic 12.5px/1.35 Georgia,serif;color:#4B4739}
.pp-fig figcaption b{font:800 11px var(--f);font-style:normal;letter-spacing:.05em}
.pp-by{margin:0;font:700 11.5px/1.3 var(--f);letter-spacing:.06em;text-transform:uppercase;color:#5E5A4C}
.pp-body{display:grid;gap:11px}
.pp-body p{margin:0;font-size:17px;line-height:1.5;overflow-wrap:anywhere;text-align:left}
.pp-dl{font:800 12.5px var(--f);letter-spacing:.05em}
.pp-body p:first-child::first-letter{}
.pp-side{display:grid;gap:10px;align-content:start}
.pp-box{border-top:4px solid var(--ink2);border-bottom:1px solid var(--ink2);padding:6px 2px 8px;display:grid;gap:2px;text-align:center}
.pp-box h2{margin:0;font:800 11px/1.2 var(--f);letter-spacing:.08em;text-transform:uppercase;font-style:normal;color:#5E5A4C}
.pp-big{font:900 clamp(26px,7vw,34px)/1.05 Georgia,serif}
.pp-sm{font:13px/1.35 var(--f);color:#4B4739}
.pp-disc{margin:0;font:12.5px/1.45 var(--f);color:#4B4739;border-top:1px solid var(--ink2);padding-top:8px}
@media (min-width:700px){
  .paper{padding:20px 28px 22px;gap:12px}
  .pp-head{grid-template-columns:116px minmax(0,1fr) 116px;align-items:center;gap:12px}.pp-mast{font-size:clamp(30px,4.6vw,46px);white-space:nowrap}
  .pp-ear{display:grid;gap:2px;font:700 11.5px/1.3 var(--f);letter-spacing:.06em;text-transform:uppercase;text-align:left;border:1px solid var(--ink2);padding:6px 8px}
  .pp-ear.r{text-align:right}
  .pp-ear b{font-size:12.5px}
  .pp-ear span{font-weight:600;color:#4B4739;letter-spacing:.03em;text-transform:none;font-size:12px}
  .pp-grid{grid-template-columns:minmax(0,1fr) 210px;gap:0 22px}
  .pp-side{border-left:1px solid var(--ink2);padding-left:20px}
  .pp-fig{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:end}
  .pp-fig figcaption{font-size:13px}
  .pp-body{display:block;columns:2;column-gap:24px;column-rule:1px solid #B5AA8E}
  .pp-body p{margin:0 0 11px;break-inside:avoid-column;text-align:left;hyphens:auto}
}

@media (max-width:640px){
  .racepill{min-height:40px}
  .desk-panel{max-height:94dvh}
  .pnl{grid-template-columns:1fr 1fr;gap:10px}
  .tl-i summary{grid-template-columns:1fr auto;grid-template-areas:"q gap" "px px"}
  .tl-q{grid-area:q}.tl-gap{grid-area:gap}.tl-px{grid-area:px}
  .wl-card{align-items:flex-start;flex-direction:column}
  .face.xl{--s:84px}
  .grid-co .choice .d.ceo{grid-column:2}
  .grid-co .choice .thumb{grid-row:1/span 5}
  .score .k{max-width:26ch;margin-left:auto}
}
@media (prefers-reduced-motion:no-preference){.desk-panel{animation:deskin .22s ease-out}@keyframes deskin{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}}

/* ---------- lookups ---------- */
const CARD={};
for(const k in CO){for(const c of CO[k].deck)CARD[c.id]=c}
for(const c of GENERIC)CARD[c.id]=c;
const EV={};for(const e of EVENTS){EV[e.id]=e;if(e.opts)CARD['ev:'+e.id]=Object.assign({cat:'Event',isEvent:1},e)}

/* ---------- plan: cards and events per quarter, fixed by the seed ---------- */
function makePlan(co,D,seed){
  const N=D.quarters,r=rngFor(seed,'plan',co.id);
  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
  const fixed=co.deck.filter(c=>c.at!=null&&c.at<N);
  const free=shuffle(co.deck.filter(c=>c.at==null||c.at>=N));
  const gen=shuffle(GENERIC);
  const used=new Set(),quarters=[];
  for(let q=0;q<N;q++){
    const cards=[];
    const f=fixed.find(c=>c.at===q);
    if(f)cards.push(f.id);else if(free.length)cards.push(free.shift().id);
    if((q%2===1||!cards.length)&&gen.length)cards.push(gen.shift().id);
    let ev=null;const re=rngFor(seed,'ev',q);
    if(q>0&&re()<D.ev){
      const wt=e=>(e.w&&e.w[co.id]!=null)?e.w[co.id]:1;
      const pool=EVENTS.filter(e=>!used.has(e.id)&&wt(e)>0);
      let x=re()*sum(pool.map(wt));
      for(const e of pool){x-=wt(e);if(x<=0){ev=e.id;break}}
      if(ev){used.add(ev);if(EV[ev].opts)cards.unshift('ev:'+ev)}
    }
    quarters.push({cards,event:ev});
  }
  return {quarters};
}

/* ---------- state ---------- */
function initState(co){
  const s=co.start;
  const st={rev:s.rev,cash:s.cash,debt:s.debt,div:s.div,shares:1,kpi:s.kpi,meters:Object.assign({},co.meters),
    pending:[],flags:{},overpromise:0,jobsCut:0,revHist:[],opHist:[],idx:100,idxHist:[100],lastG:s.g,expOp:null,guide:'maintain',gf:0,
    rd:[],hist:[],cashHist:[s.cash]};
  for(let k=4;k>=0;k--){const r=s.rev/Math.pow(1+s.g/100,k);st.revHist.push(r);st.opHist.push(r*s.m/100)}
  st.lastOp=st.opHist[4];
  st.expOp=st.lastOp*(1+s.g/100);
  st.base=valBase(st,co);
  st.eq0=equityRaw(st,co,st.base);
  return st;
}
function ttm(a){return sum(a.slice(-4))}
function valBase(st,co){const tr=ttm(st.revHist),to=ttm(st.opHist);const n=st.revHist.length;
  return {mT:to/tr*100,yoy:(st.revHist[n-1]/st.revHist[n-5]-1)*100,inv:co.meters.inv}}
function equityRaw(st,co,b){
  const tr=ttm(st.revHist),to=ttm(st.opHist),n=st.revHist.length;
  const mT=to/tr*100,yoy=(st.revHist[n-1]/st.revHist[n-5]-1)*100;
  const tf=(0.75+0.5*st.meters.inv/100)/(0.75+0.5*b.inv/100);
  const mult=co.start.mult*Math.exp(0.06*(mT-b.mT)+(co.start.gsens||0.025)*clamp(yoy-b.yoy,-30,30))*tf;
  return tr*mult-(st.debt-st.cash);
}
function annRev(st){return st.rev*4}
function minCash(st,co){return ((co&&co.start.minCash)||0.06)*annRev(st)}
function leverage(st,co){const ebitda=ttm(st.opHist)+co.start.da*4;return (st.debt-st.cash)/Math.max(ebitda,0.02*annRev(st))}

/* ---------- effects ---------- */
function pushFx(st,fx,q,rng,noise,D,mul,src){
  mul=mul||1;
  for(const e of fx){
    const v=e[0];
    if(v==='flag'){st.flags[e[1]]=true;continue}
    let mean=e[1]*mul;
    const lag=Math.round((e[2]||0)*D.lag),dur=e[3]||1;
    const isMeter=['inv','brd','emp','cus','reg','exe'].indexOf(v)>=0;
    let val=noise?mean+gauss(rng)*Math.abs(mean)*(isMeter?0.25:0.35)*D.sd:mean;
    if(Math.sign(val)!==Math.sign(mean))val=mean*0.15;
    st.pending.push({v,val,s:q+lag,e:q+lag+dur,src:src||null});
  }
}
function oddsFor(out,pmul){
  if(!pmul||pmul===1||out.length<2)return out.map(o=>o.p);
  const p0=clamp(out[0].p*pmul,0.05,0.95),rest=sum(out.slice(1).map(o=>o.p))||1;
  return [p0].concat(out.slice(1).map(o=>o.p/rest*(1-p0)));
}
function applyOpt(st,opt,q,rng,noise,D,mul,notes,src,ctx){
  if(opt.fx)pushFx(st,opt.fx,q,rng,noise,D,mul,src);
  if(ctx&&ctx.extra.length)pushFx(st,ctx.extra,q,rng,noise,D,mul,src);
  if(opt.out){
    const ps=oddsFor(opt.out,ctx&&ctx.pmul);
    if(noise){let x=rng(),pick=opt.out[opt.out.length-1];for(let i=0;i<opt.out.length;i++){x-=ps[i];if(x<=0){pick=opt.out[i];break}}
      pushFx(st,pick.fx,q,rng,noise,D,mul,src);if(notes&&pick.t)notes.push(pick.t);return pick.t}
    else{opt.out.forEach((o,i)=>pushFx(st,o.fx,q,rng,false,D,(mul||1)*ps[i],src));}
  }
  return null;
}

/* ---------- context: the same option is wise in one position and reckless in another ---------- */
function fxSum(fx,v){return sum((fx||[]).filter(e=>e[0]===v).map(e=>e[1]))}
function spendFrac(o,st){
  let c=0;const all=(o.fx||[]).concat(o.out?[].concat.apply([],o.out.map(x=>x.fx.map(e=>[e[0],e[1]*x.p,e[2],e[3]]))):[]);
  for(const e of all){const d=Math.min(e[3]||1,8);if(e[0]==='cash'&&e[1]<0)c-=e[1]*d;if(e[0]==='cr'&&e[1]<0)c-=e[1]*st.rev/100*d}
  return c/st.rev;
}
function contextFor(co,st,o,card){
  const M=st.meters,lev=leverage(st,co),floor=minCash(st,co),r={dq:0,extra:[],pmul:1,notes:[]};
  const rich=st.cash>floor*3.5&&lev<2.2,tight=st.cash<floor*2.2||lev>3.5;
  const shrinking=st.lastG<-0.3,sf=spendFrac(o,st);
  const add=(dq,fx,kind,text)=>{r.dq+=dq;r.extra.push.apply(r.extra,fx);r.notes.push([kind,text])};
  const inflow=Math.max(0,fxSum(o.fx,'cash'))+Math.max(0,fxSum(o.fx,'cr'))*st.rev/100;
  const gUp=sum((o.fx||[]).filter(e=>e[0]==='g'&&e[1]>0&&(e[3]||1)>=4).map(e=>e[1]));
  const maxSf=card?Math.max.apply(null,card.opts.map(x=>spendFrac(x,st))):sf;
  const top=sf>=maxSf*0.99,mid=!top&&sf>=maxSf*0.3;
  if(sf>=0.1&&mid){
    if(tight)add(-1,[['inv',-3],['brd',-2]],'bad','Cash is tight. Even a moderate spend strains the balance sheet.');
    else if(rich)add(1,[['inv',1],['g',0.1,2,99]],'good','You can afford this comfortably.');
  }
  if(sf>=0.1&&top){
    if(tight)add(-2,[['inv',-6],['brd',-4],['g',-0.25,1,4]],'bad','Cash is tight. A spend this size forces you to borrow at bad rates, and the board will push back.');
    else if(rich)add(2,[['inv',3],['g',0.3,2,99]],'good','You have the cash to fund this from strength, so the team can move fast.');
  }
  if(inflow>=0.2*st.rev){
    if(tight)add(2,[['inv',4],['brd',3]],'good','Cash is tight. New money now keeps you away from emergency loans.');
    else if(rich)add(-1,[['inv',-4]],'bad','You already have plenty of cash. Investors will ask why you need more.');
  }
  const emp=fxSum(o.fx,'emp');
  if(emp<=-6){
    if(M.emp<40)add(-2,[['emp',-4],['exe',-6]],'bad','Morale is already low. Deeper cuts will push your best people out.');
    else if(shrinking&&M.emp>=50)add(1,[['inv',3]],'good','Sales are falling and morale can take it. Investors want to see costs come down.');
  }
  if(o.out){
    if(M.exe>=60){r.pmul=1.4;add(2,[],'good','Execution is strong, which improves the odds.')}
    else if(M.exe<40){r.pmul=0.6;add(-2,[],'bad','Execution is weak, which worsens the odds.')}
  }
  const cautious=sf<0.02&&!o.out&&gUp<=0&&inflow<0.2*st.rev&&!!card&&card.opts.some(x=>x!==o&&(spendFrac(x,st)>=0.1||x.fx&&x.fx.some(e=>e[0]==='g'&&e[1]>0)));
  if(cautious&&shrinking&&M.cus<55)add(-2,[['g',-0.4,1,4],['inv',-3]],'bad','Sales are slipping and this does little to restart growth, so rivals can take share.');
  if(cautious&&rich&&!shrinking&&M.inv<70)add(-2,[['inv',-4],['g',-0.15,2,4]],'bad','You are sitting on a lot of cash. Investors expect you to put it to work.');
  if(gUp>0&&shrinking&&sf<0.1)add(2,[['g',0.25,1,99]],'good','Sales are falling, so anything that restarts growth is worth more now.');
  if(fxSum(o.fx,'cus')<=-5&&M.cus<38)add(-2,[['cus',-4],['g',-0.3,0,3]],'bad','Customers are already unhappy. This could push them to rivals.');
  if(fxSum(o.fx,'reg')<=-6&&M.reg<30)add(-2,[['reg',-5],['inv',-3]],'bad','Regulators are already hostile. This invites retaliation.');
  const invUp=fxSum(o.fx,'inv');
  if(invUp>=4&&M.inv>=72)add(-1,[],'bad','Investors are already enthusiastic. There is little left to win with them.');
  if(invUp>=4&&M.inv<35&&!o.out)add(1,[['inv',2]],'good','Investors are nervous. A move they like matters more now.');
  return r;
}
function ctxRaw(co,st,o,card){return o.q+contextFor(co,st,o,card).dq}
/* grade relative to the best option available in this situation */
function ctxGrades(co,st,card){const raw=card.opts.map(o=>ctxRaw(co,st,o,card)),mx=Math.max.apply(null,raw);return raw.map(v=>clamp(Math.round(3-(mx-v)),0,3))}
function ctxQ(co,st,o,card){return ctxGrades(co,st,card)[card.opts.indexOf(o)]}

/* ---------- one quarter ---------- */
/* choices: {cards:{cardId:optIndex}, reinvest, ret, debt, guide} */
function step(game,who,ch,opt){
  opt=opt||{};
  const co=CO[game.coId],D=DIFF[game.diffKey],q=game.q,st=game[who],seed=game.seed;
  const cash0=st.cash;let fin=0;
  const noise=opt.noise!==false,notes=[],outs={},fits={};
  const pq=game.plan.quarters[q];
  const sd=noise?D.sd:0;
  // event auto effects
  if(pq.event&&!opt.skipEvent){
    const ev=EV[pq.event];let mul=D.evMul;
    const sg=who==='st'?game.strategy:game.ghostStrategy;
    if(sg&&EVENT_FORCE[ev.id]&&sg.top.indexOf(EVENT_FORCE[ev.id])>=0){mul*=HEDGE;if(who==='st')opt._hedged=true}
    if(ev.cyber){mul*=st.flags.cyberShield?0.4:st.flags.cyberHalf?0.7:st.flags.cyberWeak?1.5:1}
    if(ev.auto)pushFx(st,ev.auto,q,rngFor(seed,'evfx',q),noise,D,mul);
    if(ev.autoOut){const t=applyOpt(st,{out:ev.autoOut},q,rngFor(seed,'evout',q),noise,D,mul,null);if(t)outs['ev:'+ev.id+':auto']=t}
  }
  // decisions
  if(!opt.skipCards)for(const cid of pq.cards){
    const card=CARD[cid],oi=ch.cards[cid];if(oi==null)continue;
    const o=card.opts[oi];
    const ctx=contextFor(co,st,o,card);
    const t=applyOpt(st,o,q,rngFor(seed,'fx',q,cid,oi),noise,D,1,null,{cid,oi,q},ctx);
    if(t)outs[cid]=t;
    const sg=who==='st'?game.strategy:game.ghostStrategy;
    if(sg){const f=fitOf(cid,oi,sg.posture);fits[cid]=f;
      if(f>0)pushFx(st,[['exe',2],['inv',0.5]],q,null,false,D);
      else if(f<0)pushFx(st,[['exe',-2],['inv',-1.5]],q,null,false,D)}
  }
  // allocation
  const R=annRev(st),eqNow=Math.max(equityRaw(st,co,st.base),0.05*st.eq0);
  st.rd.push(ch.reinvest||'hold');
  if(ch.reinvest==='cut')pushFx(st,[['m',0.9,0,1],['emp',-3],['exe',-1]],q,null,false,D);
  if(ch.reinvest==='raise')pushFx(st,[['cr',-2,0,1],['exe',1]],q,null,false,D);
  if(ch.reinvest==='surge')pushFx(st,[['cr',-4,0,1],['exe',-2],['inv',-2]],q,null,false,D);
  let buyback=0;
  if(ch.ret==='cutdiv'){st.div*=0.6;st.meters.inv-=8;st.meters.brd-=2}
  if(ch.ret==='startdiv'){st.div=0.004*R;st.meters.inv+=4}
  if(ch.ret==='buyback'){buyback=0.02*R;st.shares*=1-buyback/eqNow;st.meters.inv+=2}
  const dAmt=Math.max(0.03*R,0.04*st.debt);
  if(ch.debt==='pay'){const p=Math.max(0,Math.min(dAmt,st.cash-minCash(st,co)));st.debt-=p;st.cash-=p;fin-=p;st.meters.inv+=1}
  if(ch.debt==='borrow'){st.debt+=dAmt;st.cash+=dAmt;fin+=dAmt;st.meters.inv-=1}
  // activate pending
  let gm=0,mm=0;
  const kpiBefore=st.kpi;
  for(const p of st.pending){
    if(p.s>q||p.e<=q)continue;
    if(p.v==='g')gm+=p.val;else if(p.v==='m')mm+=p.val;
    else if(p.v==='cash')st.cash+=p.val;else if(p.v==='debt')st.debt+=p.val;
    else if(p.v==='cr')st.cash+=p.val*st.rev/100;else if(p.v==='dr')st.debt+=p.val*st.rev/100;
    else if(p.s===q){
      if(p.v==='kpi')st.kpi+=p.val;
      else if(p.v==='shares')st.shares*=1+p.val/100;
      else if(p.v==='div')st.div*=1+p.val/100;
      else if(st.meters[p.v]!=null)st.meters[p.v]+=p.val;
    }
  }
  st.pending=st.pending.filter(p=>p.e>q+1||p.s>q);
  // reinvestment payoff: average of choices made 3-6 quarters ago (scaled by difficulty lag)
  const L=Math.max(1,Math.round(3*D.lag));let rdSum=0;
  for(let k=L;k<L+4;k++){const c=st.rd[st.rd.length-1-k];if(c)rdSum+=RD_EFF[c]}
  gm+=rdSum/4;
  // KPI
  const K=co.kpi,ri=rngFor(seed,'idio',q),rm=rngFor(seed,'macro',q),rx=rngFor(seed,'idx',q);
  const macro=gauss(rm),idio=gauss(ri),idio2=gauss(ri),kn=gauss(ri),inoise=gauss(rx);
  if(!K.derived){
    if(co.id==='nke')st.kpi+=(3-st.kpi)*0.12+kn*0.5*sd;
    else if(co.id==='unh')st.kpi+=K.drift+kn*0.15*sd;
    else st.kpi+=K.drift||0;
    st.kpi=clamp(st.kpi,K.min,K.max);
  }
  let kpiG=0,kpiM=0;
  if(co.id==='nke')kpiG=(st.kpi-6)*0.04;
  if(co.id==='unh')kpiM=(co.start.kpi-st.kpi)*0.85;
  // revenue
  const M=st.meters;
  const g=co.start.g+gm+(M.cus-50)*0.012+kpiG+macro*0.7*sd+idio*0.4*sd;
  st.rev=st.rev*(1+g/100);
  if(co.id==='intc')st.rev+=Math.max(0,st.kpi-kpiBefore);
  if(co.id==='ba'&&kpiBefore>0)st.rev*=1+0.45*(st.kpi-kpiBefore)/kpiBefore;
  st.rev=Math.max(st.rev,0.2*co.start.rev);
  // margin and cash
  const margin=clamp(co.start.m+mm+(M.exe-50)*0.02+kpiM+idio2*0.35*sd,-40,60);
  const op=st.rev*margin/100;
  const interest=st.debt*0.045/4;
  const tax=Math.max(0,op-interest)*0.18;
  const ni=op-interest-tax;
  const fcf=ni+co.start.da-co.start.capex+co.start.wc;
  st.cash+=fcf-st.div-buyback;
  if(co.kpi.derived){st.revHist.push(st.rev);st.opHist.push(op);st.kpi=(st.rev/st.revHist[st.revHist.length-5]-1)*100;st.revHist.pop();st.opHist.pop()}
  // forced financing
  let rescue=0;
  if(st.cash<minCash(st,co)){rescue=minCash(st,co)*1.5-st.cash;st.debt+=rescue;st.cash+=rescue;fin+=rescue;M.inv-=5;M.brd-=5}
  // earnings vs expectations
  const exp=st.expOp,den=Math.max(Math.abs(exp),0.015*st.rev);
  let s=clamp((op-exp)/den,-0.6,0.6);
  const sMul=st.guide==='withdraw'?0.5:1;
  M.inv+=clamp(s*50*sMul,-10,8);
  let callNote=null;
  if(st.overpromise>0){if(s<-0.02){M.inv-=8*st.overpromise;M.brd-=4*st.overpromise;callNote='bad'}else{M.inv+=2;callNote='good'}st.overpromise=0}
  if(st.guide==='raise'&&s<-0.02){M.inv-=5;M.brd-=3}
  if(st.guide==='lower'&&s>0.02)M.inv+=2;
  // meter dynamics
  const base=co.meters;
  M.exe+=(M.emp-50)*0.02;
  for(const k in M){M[k]+=(base[k]-M[k])*0.04;M[k]=clamp(M[k],0,100)}
  // history
  st.revHist.push(st.rev);st.opHist.push(op);
  if(st.revHist.length>12){st.revHist.shift();st.opHist.shift()}
  // value index
  const prevIdx=st.idx;
  const eq=Math.max(equityRaw(st,co,st.base),0.05*st.eq0);
  const target=eq/st.shares/st.eq0*100;
  st.idx=Math.max(3,st.idx+0.75*(target-st.idx)+inoise*st.idx*0.025*sd);
  st.idxHist.push(st.idx);
  // board
  const ret=(st.idx/prevIdx-1)*100;
  M.brd+=clamp(ret*0.35,-6,6)+(s>0.02?2:s<-0.02?-3:0)+(M.inv-50)*0.02-(rescue>0?2:0);
  M.brd=clamp(M.brd,0,100);M.inv=clamp(M.inv,0,100);
  // guidance for next quarter
  const gfMap={raise:0.04,maintain:0,lower:-0.04,withdraw:0};
  st.guide=ch.guide||'maintain';st.gf=gfMap[st.guide];
  if(st.guide==='raise')M.inv=clamp(M.inv+3,0,100);
  if(st.guide==='lower')M.inv=clamp(M.inv-4,0,100);
  if(st.guide==='withdraw'){M.inv=clamp(M.inv-6,0,100);M.brd=clamp(M.brd-2,0,100)}
  st.expOp=op*(1+clamp(g,-5,5)/100)*(1+st.gf);
  st.lastG=g;st.lastOp=op;st.cashHist.push(st.cash);
  const nH=st.revHist.length;
  const rec={q,rev:st.rev,g,margin,op,fcf,cash:st.cash,debt:st.debt,kpi:st.kpi,idx:st.idx,ret,s,exp,rescue,div:st.div,buyback,outs,callNote,fits,hedged:!!opt._hedged,meters:Object.assign({},M),
    interest,tax,ni,da:co.start.da,capex:co.start.capex,wc:co.start.wc,cash0,fin,other:(st.cash-cash0)-(fcf-st.div-buyback)-fin,
    yoy:(st.revHist[nH-1]/st.revHist[nH-5]-1)*100,ttmRev:ttm(st.revHist),ttmOp:ttm(st.opHist),lev:leverage(st,co),shares:st.shares,expNext:st.expOp,guide:st.guide,eq:eq};
  st.hist.push(rec);
  return rec;
}

/* ---------- ghost: the real playbook ---------- */
function ghostChoices(game,q){
  const co=CO[game.coId],cards={};
  for(const cid of game.plan.quarters[q].cards){const c=CARD[cid];let i=c.opts.findIndex(o=>o.ghost);cards[cid]=i<0?0:i}
  return {cards,reinvest:co.real.reinvest,ret:co.real.ret,debt:co.real.debt,guide:'maintain'};
}

/* ---------- process quality for allocation and guidance ---------- */
function assess(game,ch){
  const co=CO[game.coId],st=game.st,lev=leverage(st,co);
  const fcfLast=st.hist.length?st.hist[st.hist.length-1].fcf:co.start.da-co.start.capex+co.start.wc+st.lastOp*0.7;
  const trendDown=st.lastG<0;
  const r={};
  r.reinvest={cut:(trendDown&&st.meters.cus<45)?1:2,hold:2,raise:lev<4?3:1,surge:lev>4?0:2}[ch.reinvest];
  if(ch.ret==='buyback')r.ret=(fcfLast<0||lev>3.5)?0:2;
  else if(ch.ret==='cutdiv')r.ret=(lev>3.5||fcfLast-st.div<0)?3:1;
  else if(ch.ret==='startdiv')r.ret=(fcfLast>0&&lev<2)?2:0;
  else r.ret=(fcfLast-st.div<0&&lev>4)?1:2;
  r.debt={pay:lev>2.5?3:2,hold:lev>4?1:2,borrow:lev>3?0:1}[ch.debt];
  // guidance: peek at next quarter with no noise
  const f=forecast(game,ch);
  const ratio=f.ratio;
  const best=ratio>1.03?'raise':ratio<0.97?'lower':'maintain';
  r.guide=ch.guide===best?3:ch.guide==='maintain'?2:ch.guide==='withdraw'?1:0;
  r.best=best;r.ratio=ratio;r.cashNext=f.cash;
  return r;
}
function forecast(game,ch){
  const g=clone(game);
  const c2=Object.assign({},ch,{guide:'maintain'});
  const a=step(g,'st',c2,{noise:false});
  g.q++;
  let ratio=1;
  if(g.q<g.plan.quarters.length){
    const b=step(g,'st',{cards:{},reinvest:'hold',ret:ch.ret==='buyback'?'hold':ch.ret,debt:'hold',guide:'maintain'},{noise:false,skipCards:true,skipEvent:true});
    const trend=a.op*(1+clamp(a.g,-5,5)/100);
    ratio=b.op/(Math.abs(trend)>0.0001?trend:0.0001);
    if(trend<0)ratio=b.op>=trend?1+(b.op-trend)/Math.abs(trend):1-(trend-b.op)/Math.abs(trend);
  }
  return {cash:a.cash,ratio,op:a.op};
}


/* ---------- the cabinet: named executives who remember ---------- */
const CAB_ROLES=[['cfo','Chief Financial Officer'],['coo','Chief Operating Officer'],['cco','Chief Commercial Officer'],['gc','General Counsel'],['cpo','Chief People Officer']];
const NAMES=['Dana Okafor','Marcus Lindqvist','Priya Natarajan','Tom Brennan','Elena Ruiz','Samuel Adeyemi','Grace Holloway','Kenji Watanabe','Rachel Stein','Victor Alvarez','Nadia Haddad','Owen Gallagher','Mei Chen','Andre Dupree','Laura Kowalski','Hassan Farouk','Julia Bergstrom','Darnell Price','Sofia Marchetti','Ian McAllister','Aisha Bello','Peter Novak','Hannah Leclerc','Ravi Menon'];
const ANALYSTS=[['Claire Whitmore','Halvorsen & Co.'],['Marcus Bell','Crestline Securities'],['Ana Sousa','Northgate Research'],['David Kim','Meridian Capital Markets'],['Fatima Rahman','Ashby Partners'],['Leo Hartmann','Granite Bay Equity'],['Nora Quinlan','Tidewater Securities'],['Raj Patel','Corbett Wells']];
function roleOf(who){
  if(/Counsel|Compliance|Risk|Government|Medical Officer|Sustainability|Communications|Security/.test(who))return 'gc';
  if(/People|Labor/.test(who))return 'cpo';
  if(/CFO|Treasurer|Investor Relations|Actuary/.test(who))return 'cfo';
  if(/COO|Manufactur|Supply|Operations|Quality|Engineer|Technology|Foundry|Integration|Delivery|Plant|Packaging|R&D|Innovation|Data Center|Real Estate/.test(who))return 'coo';
  if(/Sales|Marketing|Growth|Strategy|Brand|Revenue|Wholesale|Digital|Lifestyle|Running|Sport|M&A|Product|Medicare|Optum|Provider|Customer|Defense|North America|China|Marketplace|Client/.test(who))return 'cco';
  return null;
}
function newCabinet(seed){
  const r=rngFor(seed,'cab'),pool=NAMES.slice(),cab={};
  for(const [k,t] of CAB_ROLES){const i=Math.floor(r()*pool.length);cab[k]={name:pool.splice(i,1)[0],title:t,loyalty:60,since:0,ally:false}}
  cab._pool=pool;return cab;
}
function cabUpdate(game,ch){
  const cab=game.cab,q=game.q,ev=[];
  const M=game.st.meters;
  for(const cid in ch.cards){
    const card=CARD[cid],pick=ch.cards[cid];
    card.opts.forEach((o,i)=>{
      if(!o.a)return;const k=roleOf(o.a[0]);if(!k)return;const m=cab[k];
      if(i===pick){m.loyalty=clamp(m.loyalty+6,0,100)}else{m.loyalty=clamp(m.loyalty-4,0,100)}
    });
  }
  for(const [k,t] of CAB_ROLES){
    const m=cab[k];
    if(m.loyalty<58)m.loyalty+=1;
    if(m.loyalty<18){
      const hit={cfo:['inv',-5],coo:['exe',-6],cco:['cus',-4],gc:['reg',-5],cpo:['emp',-5]}[k];
      M[hit[0]]=clamp(M[hit[0]]+hit[1],0,100);
      const r=rngFor(game.seed,'repl',q,k),pool=cab._pool;const nn=pool.length?pool.splice(Math.floor(r()*pool.length),1)[0]:'Interim '+t;
      ev.push({type:'quit',k,name:m.name,title:t,repl:nn,hit});
      cab[k]={name:nn,title:t,loyalty:50,since:q+1,ally:false};
    }else if(m.loyalty>=85&&!m.ally){
      m.ally=true;const b={cfo:['inv',3],coo:['exe',4],cco:['cus',3],gc:['reg',4],cpo:['emp',4]}[k];
      M[b[0]]=clamp(M[b[0]]+b[1],0,100);ev.push({type:'ally',k,name:m.name,title:t,hit:b});
    }
  }
  return ev;
}

/* ---------- callbacks: decisions coming due ---------- */
function comingDue(game){
  const st=game.st,q=game.q,by={};
  for(const p of st.pending){
    if(!p.src||p.s!==q||q-p.src.q<2)continue;
    const k=p.src.cid+'|'+p.src.q;(by[k]=by[k]||{src:p.src,fx:[]}).fx.push([p.v,p.val]);
  }
  return Object.values(by);
}

/* ---------- earnings call ---------- */
function makeCall(game,who){
  const st=game[who],co=CO[game.coId],r=st.hist[st.hist.length-1];if(!r)return [];
  const lev=leverage(st,co),M=st.meters,qs=[];
  const sur=r.exp!==0?(r.op-r.exp)/Math.abs(r.exp)*100:0;
  const K=co.kpi,kd=(st.kpi-co.start.kpi)*K.good;
  const add=(id,bad,pri,text)=>qs.push({id,bad,pri,text});
  if(r.rescue>0)add('rescue',1,10,'You needed '+fmtB(r.rescue)+' of emergency financing this quarter. How close did the company come to running out of cash?');
  if(r.s<-0.02)add('miss',1,9,'You missed our operating income estimate by '+Math.abs(sur).toFixed(0)+'%. Why should we believe the plan is working?');
  if(r.fcf<0)add('burn',1,7,'Free cash flow was '+fmtB(r.fcf)+'. When does the cash burn stop?');
  if(lev>3.5)add('lev',1,7,'Net debt is '+lev.toFixed(1)+' times earnings. Are you considering selling shares to raise money?');
  if(M.emp<38)add('morale',1,6,'There are reports of low morale and senior departures. Are more job cuts coming?');
  if(M.reg<32)add('reg',1,6,'Regulators appear to be circling. How big is your exposure?');
  if(M.cus<38)add('cus',1,5,'Customer satisfaction looks weak. Are you losing share to competitors?');
  if(r.g<-1)add('decline',1,6,'Revenue fell '+Math.abs(r.g).toFixed(1)+'% from last quarter. What turns that around?');
  if(r.s>0.02)add('beat',0,5,'A clear beat this quarter. How much of that is sustainable versus one-time?');
  if(r.g>1.5)add('growth',0,4,'Revenue grew '+r.g.toFixed(1)+'% sequentially. What is driving it, and can it continue?');
  if(r.margin>co.start.m+1)add('margin',0,4,'Operating margin reached '+r.margin.toFixed(1)+'%. Can you hold that level?');
  add('kpi',kd<0?1:0,3,(kd>=0?K.name+' moved the right way, to ':K.name+' moved the wrong way, to ')+K.fmt(st.kpi)+'. What is your target for next year?');
  const last=game.log.length?game.log[game.log.length-1]:null;
  qs.sort((a,b)=>b.pri-a.pri);
  const pick=qs.slice(0,3),rr=rngFor(game.seed,'an',game.q),an=ANALYSTS.slice();
  return pick.map(x=>Object.assign(x,{analyst:an.splice(Math.floor(rr()*an.length),1)[0]}));
}
const TONES=[['confident','Confident','Project strength. Great if the news is good; costly if you oversell.'],['candid','Candid','Lay out the facts, good or bad.'],['deflect','Deflect','Avoid specifics and talk about the long term.']];
function callEffect(bad,tone){
  if(!bad)return {confident:{inv:4,brd:0,flag:0,q:3},candid:{inv:2,brd:1,flag:0,q:2},deflect:{inv:-2,brd:0,flag:0,q:1}}[tone];
  return {confident:{inv:2,brd:0,flag:1,q:1},candid:{inv:-1,brd:2,flag:0,q:3},deflect:{inv:-4,brd:-1,flag:0,q:0}}[tone];
}
function applyCall(game,who,qs,answers){
  const st=game[who],M=st.meters;let inv=0,brd=0,flag=0,qsum=0;
  qs.forEach((x,i)=>{const e=callEffect(x.bad,answers[i]);inv+=e.inv;brd+=e.brd;flag+=e.flag;qsum+=e.q});
  M.inv=clamp(M.inv+inv,0,100);M.brd=clamp(M.brd+brd,0,100);st.overpromise=Math.min(2,st.overpromise+(flag?1:0));
  return {inv,brd,flag,quality:qs.length?qsum/qs.length:2};
}

/* ---------- strategy: Five Forces read + how-to-win posture ---------- */
const FORCES=[['rivalry','Rivals'],['buyers','Buyers'],['suppliers','Suppliers'],['entrants','New entrants'],['substitutes','Substitutes']];
const POSTURES=[['cost','Cost leader'],['differentiate','Differentiator'],['focus','Focused niche'],['reinvent','Reinventor']];
const POSTURE_OPP={cost:'differentiate',differentiate:'cost',focus:'reinvent',reinvent:'focus'};
/* which force each shock belongs to; a force you flagged softens the shock because you saw it coming */
const EVENT_FORCE={tariff:'suppliers',inputs:'suppliers',strike:'suppliers',medtrend:'suppliers',recession:'buyers',raid:'rivalry',glp1:'substitutes'};
const HEDGE=0.65;
/* Hand-tagged: which strategy each option serves. c cost leader, d differentiator, f focus, r reinvent, - neutral.

/* exact effect text for Hard */
function qOff(n){return n<=0?'now':'in '+n+' qtr'+(n>1?'s':'')}
function fxText(e,st){
  const v=e[0],d=D(),c=co();if(v==='flag')return null;
  const lag=Math.round((e[2]||0)*d.lag),dur=e[3]||1,when=qOff(lag);
  const sg=x=>(x>0?'+':x<0?'−':'')+Math.abs(x);
  const span=dur>=50?', lasting':dur>1?', '+dur+' qtrs':'';
  if(v==='g')return 'Growth '+sg(+e[1].toFixed(2))+' pt/qtr '+when+span;
  if(v==='m')return 'Margin '+sg(+e[1].toFixed(2))+' pt '+when+span;
  if(v==='cash'||v==='cr'||v==='debt'||v==='dr'){const b=(v==='cr'||v==='dr')?e[1]*st.rev/100:e[1];const nm=(v==='cash'||v==='cr')?'Cash':'Debt';return nm+' '+(b<0?'−':'+')+fmtB(Math.abs(b))+(dur>1&&dur<50?' ×'+dur+' qtrs':dur>=50?' per qtr, lasting':'')+' '+when}
  if(v==='kpi'){const x=e[1];return c.kpi.short+' '+(x>0?'+':'−')+Math.abs(x).toFixed(Math.abs(x)<1?2:1)+' '+when}
  if(v==='shares')return 'Shares '+sg(e[1])+'%';
  if(v==='div')return 'Dividend '+sg(e[1])+'%';
  const m=METERS.find(x=>x[0]===v);if(m)return m[1]+' '+sg(e[1])+(lag>0?' '+when:'');
  return null;
}
function fxClass(e){const v=e[0],good=v==='kpi'?co().kpi.good:VAR_GOOD[v==='cr'?'cash':v==='dr'?'debt':v];if(!good)return '';return (e[1]>0)===(good>0)?'up':'down'}

/* ---------- sparkline ---------- */
function spark(a,b,W,H){
  W=W||84;H=H||30;const all=a.concat(b||[]);let lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  if(hi-lo<10){const m=(hi+lo)/2;lo=m-5;hi=m+5}
  const n=Math.max(a.length,(b||[]).length,2);
  const X=i=>(i/(n-1))*(W-6)+3,Y=v=>H-3-((v-lo)/(hi-lo))*(H-6);
  const pts=s=>s.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
  let out='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  const base=Y(100);if(base>0&&base<H)out+='<line x1="0" x2="'+W+'" y1="'+base.toFixed(1)+'" y2="'+base.toFixed(1)+'" stroke="var(--line)" stroke-dasharray="2 3"/>';
  if(b)out+='<polyline points="'+pts(b)+'" fill="none" stroke="var(--ghost)" stroke-width="1.5" stroke-dasharray="3 2"/>';
  out+='<polyline points="'+pts(a)+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  out+='<circle cx="'+X(a.length-1).toFixed(1)+'" cy="'+Y(a[a.length-1]).toFixed(1)+'" r="2.6" fill="var(--accent)"/></svg>';
  return out;
}

/* ---------- stock price, profit and loss, and the race against the real CEO ---------- */
const STAKE=10000,WK=13;
const usd=(v,d)=>(v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const sUsd=(v,d)=>(v>=0?'+':'−')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
function gameOf(who){return who==='ghost'?G.ghost:G.st}
function pxOf(who){return stockPx(co(),gameOf(who).idx)}
function pnlOf(who){const c=co(),px=pxOf(who),sh=STAKE/c.px0,val=sh*px;return {sh,px,val,pl:val-STAKE,pct:(val/STAKE-1)*100}}
/* weekly closes inside each quarter. Display only: each quarter ends exactly on the simulated price,
   and the wiggle in between is a seeded random walk pulled back to that end point. */
function stockPath(who){
  const c=co(),pts=[{t:0,v:c.px0}];let prev=100;
  gameOf(who).hist.forEach((rec,q)=>{
    const end=rec.idx,r=rngFor(G.seed,'tick',who,q),raw=[0];
    for(let i=1;i<=WK;i++)raw.push(raw[i-1]+gauss(r));
    for(let i=1;i<=WK;i++){
      const lin=prev+(end-prev)*i/WK,br=raw[i]-raw[WK]*i/WK;
      pts.push({t:q+i/WK,v:(i===WK?end:Math.max(2,lin+br*prev*0.011))*c.px0/100});
    }
    prev=end;
  });
  return pts;
}
function niceTicks(lo,hi,n){const raw=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag,s=(f<1.5?1:f<3?2:f<7?5:10)*mag,out=[];for(let v=Math.ceil(lo/s)*s;v<=hi+1e-9;v+=s)out.push(v);return out}
function stockChart(){
  const nar=(window.innerWidth||800)<600,c=co(),N=D().quarters,W=nar?360:680,H=nar?230:250,L=nar?46:56,R=12,T=14,B=28,FS=nar?11:12;
  const you=stockPath('st'),gh=stockPath('ghost');
  const vs=you.concat(gh).map(p=>p.v).concat([c.px0]);
  let lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);const pad=(hi-lo)*0.14||c.px0*0.06;lo=Math.max(0,lo-pad);hi+=pad;
  const X=t=>L+(t/N)*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const fv=v=>'$'+(v>=100?v.toFixed(0):v>=20?v.toFixed(1):v.toFixed(2));
  const eu=you[you.length-1].v,eg=gh[gh.length-1].v;
  let h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Share price by week. You: '+fmtPx(eu)+'. '+esc(c.ceoLast)+': '+fmtPx(eg)+'. Started at '+fmtPx(c.px0)+'.">';
  for(const v of niceTicks(lo,hi,4))h+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)"/><text x="'+(L-7)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="'+FS+'" fill="var(--muted)" font-family="Geist Mono, monospace">'+fv(v)+'</text>';
  h+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(c.px0).toFixed(1)+'" y2="'+Y(c.px0).toFixed(1)+'" stroke="var(--muted)" stroke-dasharray="4 4"/>';
  for(let i=0;i<=N;i+=nar?Math.ceil(N/3):Math.max(1,Math.round(N/6)))h+='<text x="'+X(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="'+(i===N?'end':'middle')+'" font-size="'+FS+'" fill="var(--muted)" font-family="Geist Mono, monospace">'+(i===0?'start':qLabel(i-1))+'</text>';
  const line=(pts,col,w,dash)=>'<polyline points="'+pts.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="'+w+'" stroke-linejoin="round" stroke-linecap="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
  h+=line(gh,'var(--ghost)',2,'6 4')+line(you,'var(--accent)',2.6);
  const ex=X(you[you.length-1].t);
  h+='<circle cx="'+ex.toFixed(1)+'" cy="'+Y(eg).toFixed(1)+'" r="3.5" fill="var(--ghost)"/><circle cx="'+ex.toFixed(1)+'" cy="'+Y(eu).toFixed(1)+'" r="4.2" fill="var(--accent)"/>';
  return h+'</svg>';
}
function raceGap(){const c=co(),d=pxOf('st')-pxOf('ghost');return {d,pts:G.st.idx-G.ghost.idx,txt:(d>=0?'You lead ':'You trail ')+c.ceoLast+' by '+usd(Math.abs(d),2)+' a share'}}
function raceTable(){
  const c=co(),a=G.st,b=G.ghost,P=(x,y,fmt,better,lab)=>{
    const d=x-y,win=Math.abs(d)<1e-6?0:(d>0?1:-1)*better;
    return '<tr><td>'+lab+'</td><td class="n">'+fmt(x)+'</td><td class="n">'+fmt(y)+'</td><td class="n '+(win>0?'up':win<0?'down':'faint')+'">'+(win>0?'You':win<0?esc(c.ceoLast):'Even')+'</td></tr>'};
  const sa=scorecard(a,c).overall,sb=scorecard(b,c).overall,n0=v=>v.toFixed(0),n1=v=>v.toFixed(1);
  let h='<div class="tblwrap"><table class="tbl race"><thead><tr><th>Right now</th><th>You</th><th>'+esc(c.ceoLast)+'</th><th>Ahead</th></tr></thead><tbody>';
  h+=P(pxOf('st'),pxOf('ghost'),v=>fmtPx(v),1,'Stock price');

    if(ev)h+='<p class="tl-ev"><b>'+(EV[ev].opts?'Event: ':'Happened: ')+'</b>'+esc(EV[ev].title)+'</p>';

  return h+'</ol>';
}

function plEmailOK(e){e=String(e||'').trim();return e.length<=120&&/^[^\s@<>(),;:"\\]+@[^\s@<>(),;:"\\]+\.[^\s@<>(),;:"\\.]{2,}$/.test(e)}
function plLast(n){const w=plClean(n).split(' ').filter(Boolean);return w.length?w[w.length-1]:''}
function plFirst(n){const w=plClean(n).split(' ').filter(Boolean);return w.length?w[0]:''}
function plCEO(){const p=PL();return p?'CEO '+plLast(p.name):''}
/* a starting leaderboard name that passes the server rules (letters, numbers, space . _ -, 2 to 16) */
function plBoardName(){const p=PL();if(!p)return '';const f=plFirst(p.name).normalize('NFD').replace(/[^A-Za-z0-9]/g,''),l=plLast(p.name).normalize('NFD').replace(/[^A-Za-z0-9]/g,'');
  const n=(f+(l&&l!==f?' '+l[0]+'.':'')).trim();return n.length>=2?n.slice(0,16):''}
let leadBusy=false;
async function sendLead(){
  const p=store.get(PKEY);if(!p||p.sent||!p.email||!NET.ok||leadBusy)return false;
  leadBusy=true;let ok=false;
  try{await NET.post('/api/leads',{name:p.name||'Player',email:p.email,updates:!!p.updates,co:G?G.coId:undefined,d:G?G.diffKey:undefined});const q=store.get(PKEY);if(q&&q.email===p.email){q.sent=true;store.set(PKEY,q)}ok=true}
  catch(e){/* try again on the next start; play is never blocked */}
  leadBusy=false;return ok;
}

async function submitContact(){
  const m=document.getElementById('ctemail'),er=document.getElementById('ctemail-e'),nm=document.getElementById('ctname');
  const email=m.value.trim(),name=nm?plClean(nm.value):(PL()?PL().name:'');
  if(!plEmailOK(email)){er.textContent='Enter a valid email, like you@example.com.';m.setAttribute('aria-invalid','true');m.focus();return}
  if(nm&&!plNameOK(name)){er.textContent='Enter your name, at least 2 letters.';nm.focus();return}
  er.textContent='';m.removeAttribute('aria-invalid');
  const upd=!!document.getElementById('ctupd').checked,btn=document.querySelector('#contactform button[type=submit]');
  btn.disabled=true;flash('ctmsg','Saving…');
  store.set(PKEY,Object.assign({},store.get(PKEY)||{},{name,email,updates:upd,sent:false}));
  const ok=await sendLead();
  if(ok){const sec=document.getElementById('contact');if(sec)sec.innerHTML='<h3 class="h3">A note from the developer</h3><p class="body">Thanks, your email is saved. You can have it removed any time on the <a href="/privacy" target="_blank" rel="noopener">privacy page</a>.</p>'}
  else{flash('ctmsg','Could not save it right now. Try again in a minute.','down');btn.disabled=false}
}

function storyLinks(c,refs){
  const out=refs.map(r=>r.startsWith('f')?c.facts[+r.slice(1)][1]:c.strategy.forces[r.slice(2)].src).filter((u,i,a)=>u&&a.indexOf(u)===i);
  return out.map((u,i)=>ext(u,out.length>1?'Source '+(i+1):'Source')).join('');
}

function pipelineTable(){
  const st=G.st,q=G.q,c=co(),map={};
  for(const p of st.pending){if(p.e<=q)continue;const k=p.v+'|'+p.s+'|'+p.e;map[k]=map[k]||{v:p.v,s:p.s,e:p.e,val:0};map[k].val+=p.val}
  const rows=Object.values(map).filter(r=>Math.abs(r.val)>1e-6).sort((a,b)=>a.s-b.s||a.v.localeCompare(b.v));
  const L=Math.max(1,Math.round(3*D().lag)),RD={cut:-0.3,hold:0,raise:0.35,surge:0.55};
  let h='<details class="fold"><summary>Effects in your pipeline ('+rows.length+')</summary>';
  if(!rows.length)h+='<p class="note">Nothing pending.</p>';
  else{
    h+='<div class="tblwrap"><table class="tbl"><thead><tr><th>Effect</th><th>Size</th><th>When</th></tr></thead><tbody>';
    for(const r of rows.slice(0,18)){
      let nm,sz;
      if(r.v==='g'){nm='Revenue growth';sz=fmtPct(r.val,2).replace('%',' pt/qtr')}
      else if(r.v==='m'){nm='Operating margin';sz=fmtPct(r.val,2).replace('%',' pt')}
      else if(r.v==='cash'||r.v==='debt'){nm=r.v==='cash'?'Cash':'Debt';sz=(r.val<0?'−':'+')+fmtB(Math.abs(r.val))+'/qtr'}
      else if(r.v==='cr'||r.v==='dr'){nm=r.v==='cr'?'Cash':'Debt';sz=fmtPct(r.val,2).replace('%','% of rev/qtr')}
      else if(r.v==='kpi'){nm=c.kpi.short;sz=(r.val>0?'+':'−')+Math.abs(r.val).toFixed(2)}
      else if(r.v==='shares'||r.v==='div'){nm=r.v==='shares'?'Share count':'Dividend';sz=fmtPct(r.val,1)}
      else{const m=METERS.find(x=>x[0]===r.v);nm=m?m[1]:r.v;sz=(r.val>0?'+':'−')+Math.abs(r.val).toFixed(1)}
      const once=['g','m','cash','debt','cr','dr'].indexOf(r.v)<0;
      h+='<tr><td>'+esc(nm)+'</td><td class="n '+fxClass([r.v,r.val])+'">'+sz+'</td><td class="n">'+(once?(r.s<=q?'now':qLabel(r.s))+', once':(r.s<=q?'now':qLabel(r.s))+' → '+(r.e-r.s>=50?'lasting':qLabel(r.e-1)))+'</td></tr>';
    }
    h+='</tbody></table></div>';
  }
  let rd=0;for(let k=L;k<L+4;k++){const ch=st.rd[st.rd.length-k];if(ch)rd+=RD[ch]}
  h+='<p class="note" style="margin-top:8px">Past reinvestment adds '+fmtPct(rd/4,2).replace('%',' pt')+' to growth this quarter. Each plan pays off '+L+' to '+(L+3)+' quarters later. Sizes shown include luck already drawn.</p></details>';
  return h;
}

/* ---------- DECISION ---------- */
function chipsFor(o){
  const d=D(),c=co();
  if(d.hints==='numbers'){
    const st=G.st;let h='<div class="chips">';
    for(const e of (o.fx||[])){const t=fxText(e,st);if(t)h+='<span class="chip '+fxClass(e)+'">'+esc(t)+'</span>'}
    if(o.jobs)h+='<span class="chip jobs">≈ '+jobsFmt(o.jobs*c.workforce)+' jobs</span>';
    h+='</div>';
    return h;
  }
  const agg={};
  const add=(fx,risk)=>{for(const e of fx){const v=e[0];if(v==='flag')continue;const key=v==='cr'?'cash':v==='dr'?'debt':v;const dur=(['cash','cr','debt','dr','g','m'].indexOf(v)>=0)?(e[3]||1):1;
    agg[key]=agg[key]||{s:0,lag:99};agg[key].s+=e[1]*Math.min(dur,8);agg[key].lag=Math.min(agg[key].lag,e[2]||0)}};
  add(o.fx||[]);if(o.out)for(const x of o.out)add(x.fx);
  let h='<div class="chips">';
  if(o.jobs)h+='<span class="chip jobs">≈ '+jobsFmt(o.jobs*c.workforce)+' jobs</span>';
  for(const k in agg){
    const a=agg[k];if(Math.abs(a.s)<1e-9)continue;
    const lbl=varName(k);
    if(d.hints==='tags'){h+='<span class="chip">'+esc(lbl)+'</span>';continue}
    const good=k==='kpi'?c.kpi.good:VAR_GOOD[k];
    const cls=good===0?'':((a.s>0)===(good>0)?'up':'down');
    h+='<span class="chip '+cls+'">'+(cls==='up'?'+ ':cls==='down'?'− ':'')+esc(lbl)+(a.lag>=2?', later':'')+'</span>';
  }
  if(o.out)h+='<span class="chip risk">'+(d.hints==='plain'?'A gamble':'Uncertain outcome')+'</span>';
  return h+'</div>';
}
function oddsFor_(o,ctx){
  const st=G.st,ps=oddsFor(o.out,ctx.pmul);
  let h='<div class="odds">';
  o.out.forEach((x,i)=>{
    h+='<div class="oddrow"><span class="pct">'+Math.round(ps[i]*100)+'%</span><span>'+esc(x.t);
    if(isFull())h+='<span class="chips" style="margin-top:4px">'+(x.fx.length?x.fx.map(e=>{const t=fxText(e,st);return t?'<span class="chip '+fxClass(e)+'">'+esc(t)+'</span>':''}).join(''):'<span class="chip">No further effect</span>')+'</span>';
    h+='</span></div>';
  });
  return h+'</div>';
}

/* ---------- COMMIT ---------- */
function commit(){
  const ch=choicesNow(),c=co();
  const a=assess(G,ch);
  const quality={cards:{},reinvest:a.reinvest,ret:a.ret,debt:a.debt,guide:a.guide,bestGuide:a.best,ctx:{}};
  for(const k in ch.cards){const card=CARD[k];quality.cards[k]=ctxGrades(c,G.st,card)[ch.cards[k]];quality.ctx[k]=ctxGrades(c,G.st,card)}
  UI.prevMeters=Object.assign({},G.st.meters);UI.prevIdx=G.st.idx;
  const jobsBefore=G.st.jobsCut;
  const rec=commitQuarter(G,ch,quality);
  rec.jobs=G.st.jobsCut-jobsBefore;
  UI.last=rec;UI.card=0;UI.picks={};UI.alloc=null;UI.answers=[];UI.callRes=null;
  NET.ev('q',{co:G.coId,d:G.diffKey,q:Math.min(19,G.q-1)});
  if(G.status!=='play')recordBest();

function lineChart(series,N){
  const W=680,H=260,L=40,R=30,T=14,B=30;
  const all=[].concat.apply([],series.map(s=>s.v));
  let lo=Math.min.apply(null,all.concat([100])),hi=Math.max.apply(null,all.concat([100]));
  const pad=(hi-lo)*0.1||5;lo=Math.floor((lo-pad)/10)*10;hi=Math.ceil((hi+pad)/10)*10;
  const X=i=>L+(i/Math.max(N,1))*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let h='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Value index by quarter">';
  const step=(hi-lo)>160?40:(hi-lo)>60?20:10;
  for(let v=lo;v<=hi;v+=step)h+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"'+(v===100?' stroke-dasharray="4 3"':'')+'/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Geist Mono, monospace">'+v+'</text>';
  for(let i=0;i<=N;i+=Math.max(1,Math.round(N/7)))h+='<text x="'+X(i)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Geist Mono, monospace">'+(i===0?'start':qLabel(i-1))+'</text>';
  for(const s of series){
    h+='<polyline points="'+s.v.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'" fill="none" stroke="'+s.c+'" stroke-width="'+(s.w||2)+'" stroke-linejoin="round"'+(s.dash?' stroke-dasharray="'+s.dash+'"':'')+'/>';
    const li=s.v.length-1;h+='<circle cx="'+X(li)+'" cy="'+Y(s.v[li])+'" r="3.5" fill="'+s.c+'"/>';
  }
  return h+'</svg>';
}
